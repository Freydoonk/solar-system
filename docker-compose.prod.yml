services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ball-physics-prod 
    image: ball-physics:prod
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s